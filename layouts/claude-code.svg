  <rect x="82" y="9.5" width="40" height="3" rx="1.5" fill="#faf9f5"/>
  <!-- two terminal cards, the second veiled -->
  <rect x="76.5" y="22.5" width="135" height="164" rx="7" fill="#262624" stroke="#dedcd1" stroke-opacity="0.2"/>
  <line x1="77" y1="33" x2="211" y2="33" stroke="#dedcd1" stroke-opacity="0.12"/>
  <rect x="82" y="26.5" width="34" height="3" rx="1.5" fill="#c2c0b6"/>
  <g>
    <text x="83" y="45" font-family="monospace" font-size="7" fill="#d97757">✻</text>
    <rect x="92" y="40" width="46" height="3" rx="1.5" fill="#e8e6dc"/>
    <rect x="83" y="50" width="96" height="3" rx="1.5" fill="#85837c"/>
    <rect x="83" y="57" width="74" height="3" rx="1.5" fill="#85837c"/>
    <rect x="83" y="67" width="20" height="3" rx="1.5" fill="#8fb85c"/>
    <rect x="106" y="67" width="56" height="3" rx="1.5" fill="#e8e6dc"/>
    <rect x="83" y="74" width="20" height="3" rx="1.5" fill="#e5636b"/>
    <rect x="106" y="74" width="44" height="3" rx="1.5" fill="#e8e6dc"/>
    <rect x="82" y="160" width="124" height="20" rx="5" fill="#30302e" stroke="#dedcd1" stroke-opacity="0.2"/>
    <rect x="88" y="168.5" width="4" height="5" fill="#d97757"/>
