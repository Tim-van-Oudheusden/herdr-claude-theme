  <rect x="215.5" y="22.5" width="97" height="164" rx="7" fill="#262624" stroke="#dedcd1" stroke-opacity="0.12"/>
  <rect x="216" y="23" width="96" height="163" rx="7" fill="#262624" fill-opacity="0.25"/>
  <line x1="216" y1="33" x2="312" y2="33" stroke="#dedcd1" stroke-opacity="0.12"/>
  <rect x="221" y="26.5" width="26" height="3" rx="1.5" fill="#9c9a92"/>
  <g fill-opacity="0.75">
    <rect x="222" y="40" width="60" height="3" rx="1.5" fill="#6ea2e6"/>
    <rect x="222" y="47" width="78" height="3" rx="1.5" fill="#85837c"/>
    <rect x="222" y="54" width="52" height="3" rx="1.5" fill="#85837c"/>
