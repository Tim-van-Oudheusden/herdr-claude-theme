  <g>
    <rect x="8" y="32" width="56" height="10" rx="3" fill="#faf9f5" fill-opacity="0.09"/>
    <rect x="11" y="34.5" width="5" height="5" rx="1.5" fill="#d97757"/>
    <rect x="19" y="35.5" width="30" height="3" rx="1.5" fill="#faf9f5"/>
    <rect x="11" y="46.5" width="5" height="5" rx="1.5" fill="#6fb3a2"/>
    <rect x="19" y="47.5" width="24" height="3" rx="1.5" fill="#9c9a92"/>
